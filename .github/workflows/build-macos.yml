name: Build macOS

on:
  workflow_dispatch:
    inputs:
      arch:
        description: '目标架构'
        required: true
        default: 'both'
        type: choice
        options:
          - arm64
          - x86_64
          - both
      sign:
        description: '启用代码签名'
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v*'
    # main 上依赖变了就跑一次，把 Rust 依赖缓存存到 main：tag 构建只能读 main 和自己的缓存。
    # tag 推送不受 paths 限制。/ Warm the Rust cache on main when dependencies change: tag builds
    # can only read caches from main or their own tag. Path filters don't apply to tag pushes.
    branches:
      - main
    paths:
      - 'desktop/src-tauri/Cargo.lock'
      - 'desktop/src-tauri/Cargo.toml'
      - '.github/workflows/build-macos.yml'
  # GitHub 会清掉 7 天没用过的缓存，每周两次让 main 上的缓存保持新鲜。
  # GitHub evicts caches unused for 7 days; refresh twice a week.
  schedule:
    - cron: '17 2 * * 1,4'

permissions:
  contents: write

env:
  NODE_VERSION: '20'
  # Must match minimumSystemVersion in tauri.conf.json to ensure consistent
  # native UI rendering (traffic light buttons, titlebar style, etc.)
  MACOSX_DEPLOYMENT_TARGET: '14.0'
  # Apple Developer ID code-signing + notarization. All optional: when the
  # secrets are unset, APPLE_SIGNING_IDENTITY is empty and the sign/notarize
  # steps are skipped (producing an unsigned, ad-hoc build as before).
  APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
  APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
  APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
  APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
  APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
  APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
  # Stable (non-notarized) signing for builds without a Developer ID. Any
  # code-signing certificate works, typically the free "Apple Development" one
  # exported as .p12. Gatekeeper still asks for the first-open approval, but the
  # app gets a stable designated requirement, so Keychain "Always Allow" survives
  # upgrades instead of re-asking for the login password for every saved SSH
  # credential after each release (ad-hoc signatures are matched by cdhash).
  MACOS_STABLE_SIGN_CERTIFICATE: ${{ secrets.MACOS_STABLE_SIGN_CERTIFICATE }}
  MACOS_STABLE_SIGN_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_STABLE_SIGN_CERTIFICATE_PASSWORD }}

jobs:
  build-macos-arm64:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.arch == 'arm64' || inputs.arch == 'both' }}
    runs-on: macos-latest  # Apple Silicon (M1+)
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26 (macOS 26 SDK for native UI)
        run: |
          XCODE_26=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE_26" ]; then
            sudo xcode-select -s "$XCODE_26"
            echo "Selected: $XCODE_26"
          fi
          xcodebuild -version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          # tag 上存的缓存只有同一个 tag 能读，下次发版永远用不上，存它白耗 ~40 秒。
          # A cache saved on a tag is only readable by that same tag, so it is never reused; skip saving it.
          save-if: ${{ !startsWith(github.ref, 'refs/tags/') }}

      # 前端由 tauri.conf.json 的 beforeBuildCommand（npm run build）在 tauri build 里构建，这里只装依赖。
      # The frontend is built by beforeBuildCommand inside `tauri build`; only install deps here.
      - name: Install desktop dependencies
        run: |
          cd desktop
          npm ci

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Import Developer ID certificate
        if: ${{ env.APPLE_SIGNING_IDENTITY != '' }}
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Prepare notarization API key
        if: ${{ env.APPLE_SIGNING_IDENTITY != '' }}
        run: |
          printf '%s' "$APPLE_API_KEY" > "$RUNNER_TEMP/asc_api_key.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/asc_api_key.p8" >> "$GITHUB_ENV"

      - name: Import stable signing certificate (no Developer ID)
        if: ${{ env.APPLE_SIGNING_IDENTITY == '' && env.MACOS_STABLE_SIGN_CERTIFICATE != '' }}
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.MACOS_STABLE_SIGN_CERTIFICATE }}
          p12-password: ${{ secrets.MACOS_STABLE_SIGN_CERTIFICATE_PASSWORD }}

      - name: Resolve stable signing identity
        if: ${{ env.APPLE_SIGNING_IDENTITY == '' && env.MACOS_STABLE_SIGN_CERTIFICATE != '' }}
        run: |
          # Use the SHA-1 so codesign picks exactly the imported certificate.
          id=$(security find-identity -p codesigning | awk '$1 ~ /^[0-9]+\)$/ && $2 ~ /^[0-9A-F]+$/ && length($2) == 40 { print $2; exit }')
          if [ -z "$id" ]; then
            echo "::error::MACOS_STABLE_SIGN_CERTIFICATE did not provide a code-signing identity"
            exit 1
          fi
          echo "STABLE_SIGN_ID=$id" >> "$GITHUB_ENV"

      - name: Build Tauri app (arm64)
        run: |
          cd desktop
          # Tauri 按「环境变量是否存在」判断要不要签名，空字符串也算存在。未配置签名
          # secret 时，工作流级 env 会把这些名字注入成空值，Tauri 于是去执行
          # `security import` 导入一份空证书，构建就在这一步断掉：
          #   SecKeychainItemImport: One or more parameters passed to a function were not valid.
          #   failed to run command security import: failed to import keychain certificate
          # 未签名路径下显式清掉，与 build-macos.sh 的未签名分支保持一致。
          if [ -z "${APPLE_SIGNING_IDENTITY:-}" ]; then
            unset APPLE_SIGNING_IDENTITY APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD \
                  APPLE_API_KEY APPLE_API_ISSUER_ID APPLE_API_KEY_ID \
                  APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          fi
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            unset TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          fi
          npm run tauri build -- --target aarch64-apple-darwin
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Build & embed Finder Extension (arm64)
        env:
          # Only sign the appex with the real Developer ID when the .app will
          # also be signed + notarized — otherwise keep it ad-hoc so the bundle
          # is internally consistent.
          SIGN_ENABLED: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.sign) && '1' || '' }}
        run: |
          APP_PATH=$(find desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos -name "*.app" -maxdepth 1 | head -1)
          if [ -n "$SIGN_ENABLED" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            SIGN_ID="$APPLE_SIGNING_IDENTITY"
          elif [ -n "${STABLE_SIGN_ID:-}" ]; then
            SIGN_ID="$STABLE_SIGN_ID"
          else
            SIGN_ID="-"
          fi
          bash desktop/scripts/build-finder-extension.sh "$APP_PATH" "$SIGN_ID"
          if [ -n "${STABLE_SIGN_ID:-}" ] && [ "$SIGN_ID" = "$STABLE_SIGN_ID" ]; then
            # 没有 Developer ID 时用固定证书签名（不公证）。ad-hoc 签名在钥匙串里只按
            # cdhash 识别，每个版本都变，升级后每条已存的 SSH 凭据都会再要一次登录密码；
            # 固定证书的 designated requirement 不随版本变化，「始终允许」可以一直有效。
            codesign --force --options runtime --timestamp \
              --entitlements desktop/src-tauri/Entitlements.plist \
              --sign "$SIGN_ID" "$APP_PATH"
            codesign --verify --deep --strict --verbose=2 "$APP_PATH"
            codesign -d -r- "$APP_PATH"
          elif [ "$SIGN_ID" = "-" ]; then
            # 嵌入 .appex 之后外层 .app 的签名已失效，只剩主二进制的 linker 签名。
            # 免费分发路径必须在这里补一次 ad-hoc 重签，否则 codesign --verify 会报
            # "code has no resources but signature indicates they must be present"，
            # 接收方可能看到「MeTerm 已损坏，无法打开」而不是「无法验证开发者」。
            # 那种情况下清除隔离标记也无效，所以这一步是免费分发能否成立的前提。
            codesign --force --sign - "$APP_PATH"
            codesign --verify --strict --verbose=2 "$APP_PATH"
          fi

      # Developer ID sign + notarize + staple the .app (the .appex was already
      # signed inside-out in the previous step). Runs on release tags, or on a
      # manual dispatch with sign=true — whenever signing secrets are present.
      - name: Sign & notarize app (arm64)
        if: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.sign) && env.APPLE_SIGNING_IDENTITY != '' }}
        env:
          ENTITLEMENTS_PATH: desktop/src-tauri/Entitlements.plist
        run: |
          APP_PATH=$(find desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos -name "*.app" -maxdepth 1 | head -1)
          bash desktop/scripts/macos-sign-notarize.sh app "$APP_PATH"

      # Rebuild updater .tar.gz after embedding Finder Extension (Tauri creates it before we embed)
      - name: Rebuild updater artifact with Finder Extension (arm64)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          BUNDLE_DIR=desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos
          APP_NAME=$(basename "$(find "$BUNDLE_DIR" -name "*.app" -maxdepth 1 | head -1)")
          if [ -n "$APP_NAME" ] && [ -f "$BUNDLE_DIR/${APP_NAME}.tar.gz" ]; then
            echo "Rebuilding ${APP_NAME}.tar.gz with Finder Extension..."
            cd "$BUNDLE_DIR"
            rm -f "${APP_NAME}.tar.gz"
            tar czf "${APP_NAME}.tar.gz" "$APP_NAME"
            # Re-sign with Tauri updater key if available
            if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
              npx --yes @tauri-apps/cli signer sign -k "$TAURI_SIGNING_PRIVATE_KEY" \
                ${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:+-p "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"} \
                "${APP_NAME}.tar.gz"
            fi
          fi

      - name: Rename updater artifacts (arm64)
        run: |
          BUNDLE_DIR=desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos
          if [ -f "$BUNDLE_DIR/MeTerm.app.tar.gz" ]; then
            mv "$BUNDLE_DIR/MeTerm.app.tar.gz" "$BUNDLE_DIR/MeTerm_aarch64.app.tar.gz"
            mv "$BUNDLE_DIR/MeTerm.app.tar.gz.sig" "$BUNDLE_DIR/MeTerm_aarch64.app.tar.gz.sig"
          fi

      # Rebuild DMG after embedding Finder Extension
      - name: Rebuild DMG with Finder Extension (arm64)
        run: |
          DMG_DIR=desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg
          APP_PATH=$(find desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos -name "*.app" -maxdepth 1 | head -1)
          if [ -n "$APP_PATH" ] && [ -d "$DMG_DIR" ]; then
            APP_NAME=$(basename "$APP_PATH" .app)
            OLD_DMG=$(find "$DMG_DIR" -name "*.dmg" -maxdepth 1 | head -1)
            if [ -n "$OLD_DMG" ]; then
              DMG_NAME=$(basename "$OLD_DMG")
              rm -f "$OLD_DMG"
              bash desktop/scripts/build-dmg.sh "$APP_PATH" "$DMG_DIR/$DMG_NAME" "$APP_NAME"
            fi
          fi

      - name: Sign & notarize dmg (arm64)
        if: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.sign) && env.APPLE_SIGNING_IDENTITY != '' }}
        run: |
          DMG_PATH=$(find desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name "*.dmg" -maxdepth 1 | head -1)
          if [ -n "$DMG_PATH" ]; then
            bash desktop/scripts/macos-sign-notarize.sh dmg "$DMG_PATH"
          fi

      - name: Upload DMG (arm64)
        uses: actions/upload-artifact@v4
        with:
          name: meterm-macos-arm64-dmg
          path: desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          retention-days: 1

      - name: Upload App Bundle (arm64)
        uses: actions/upload-artifact@v4
        with:
          name: meterm-macos-arm64-app
          path: desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app
          retention-days: 1

      - name: Compose release body (tag only)
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: bash .github/scripts/release-body.sh "${GITHUB_REF_NAME}" > "${RUNNER_TEMP}/release-body.md"

      - name: Publish release assets (tag only)
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*_aarch64.app.tar.gz
            desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*_aarch64.app.tar.gz.sig
          # 正文由 UPDATE.md 现场生成 / body generated from UPDATE.md
          body_path: ${{ runner.temp }}/release-body.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

  build-macos-x86_64:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.arch == 'x86_64' || inputs.arch == 'both' }}
    runs-on: macos-latest  # Cross-compile x86_64 on Apple Silicon
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26 (macOS 26 SDK for native UI)
        run: |
          XCODE_26=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE_26" ]; then
            sudo xcode-select -s "$XCODE_26"
            echo "Selected: $XCODE_26"
          fi
          xcodebuild -version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          # tag 上存的缓存只有同一个 tag 能读，下次发版永远用不上，存它白耗 ~40 秒。
          # A cache saved on a tag is only readable by that same tag, so it is never reused; skip saving it.
          save-if: ${{ !startsWith(github.ref, 'refs/tags/') }}

      # 前端由 tauri.conf.json 的 beforeBuildCommand（npm run build）在 tauri build 里构建，这里只装依赖。
      # The frontend is built by beforeBuildCommand inside `tauri build`; only install deps here.
      - name: Install desktop dependencies
        run: |
          cd desktop
          npm ci

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Import Developer ID certificate
        if: ${{ env.APPLE_SIGNING_IDENTITY != '' }}
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Prepare notarization API key
        if: ${{ env.APPLE_SIGNING_IDENTITY != '' }}
        run: |
          printf '%s' "$APPLE_API_KEY" > "$RUNNER_TEMP/asc_api_key.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/asc_api_key.p8" >> "$GITHUB_ENV"

      - name: Import stable signing certificate (no Developer ID)
        if: ${{ env.APPLE_SIGNING_IDENTITY == '' && env.MACOS_STABLE_SIGN_CERTIFICATE != '' }}
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.MACOS_STABLE_SIGN_CERTIFICATE }}
          p12-password: ${{ secrets.MACOS_STABLE_SIGN_CERTIFICATE_PASSWORD }}

      - name: Resolve stable signing identity
        if: ${{ env.APPLE_SIGNING_IDENTITY == '' && env.MACOS_STABLE_SIGN_CERTIFICATE != '' }}
        run: |
          # Use the SHA-1 so codesign picks exactly the imported certificate.
          id=$(security find-identity -p codesigning | awk '$1 ~ /^[0-9]+\)$/ && $2 ~ /^[0-9A-F]+$/ && length($2) == 40 { print $2; exit }')
          if [ -z "$id" ]; then
            echo "::error::MACOS_STABLE_SIGN_CERTIFICATE did not provide a code-signing identity"
            exit 1
          fi
          echo "STABLE_SIGN_ID=$id" >> "$GITHUB_ENV"

      - name: Build Tauri app (x86_64)
        run: |
          cd desktop
          # 同 arm64：空值的 Apple 签名变量会被 Tauri 当成「要签名」而触发 security import 失败。
          if [ -z "${APPLE_SIGNING_IDENTITY:-}" ]; then
            unset APPLE_SIGNING_IDENTITY APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD \
                  APPLE_API_KEY APPLE_API_ISSUER_ID APPLE_API_KEY_ID \
                  APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          fi
          npm run tauri build -- --target x86_64-apple-darwin
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Build & embed Finder Extension (x86_64)
        env:
          # Only sign the appex with the real Developer ID when the .app will
          # also be signed + notarized — otherwise keep it ad-hoc so the bundle
          # is internally consistent.
          SIGN_ENABLED: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.sign) && '1' || '' }}
        run: |
          APP_PATH=$(find desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/macos -name "*.app" -maxdepth 1 | head -1)
          if [ -n "$SIGN_ENABLED" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            SIGN_ID="$APPLE_SIGNING_IDENTITY"
          elif [ -n "${STABLE_SIGN_ID:-}" ]; then
            SIGN_ID="$STABLE_SIGN_ID"
          else
            SIGN_ID="-"
          fi
          bash desktop/scripts/build-finder-extension.sh "$APP_PATH" "$SIGN_ID"
          if [ -n "${STABLE_SIGN_ID:-}" ] && [ "$SIGN_ID" = "$STABLE_SIGN_ID" ]; then
            # 没有 Developer ID 时用固定证书签名（不公证）。ad-hoc 签名在钥匙串里只按
            # cdhash 识别，每个版本都变，升级后每条已存的 SSH 凭据都会再要一次登录密码；
            # 固定证书的 designated requirement 不随版本变化，「始终允许」可以一直有效。
            codesign --force --options runtime --timestamp \
              --entitlements desktop/src-tauri/Entitlements.plist \
              --sign "$SIGN_ID" "$APP_PATH"
            codesign --verify --deep --strict --verbose=2 "$APP_PATH"
            codesign -d -r- "$APP_PATH"
          elif [ "$SIGN_ID" = "-" ]; then
            # 理由同 arm64 那一步：嵌入 .appex 后外层 .app 必须补一次 ad-hoc 重签，
            # 否则包签名残缺，接收方可能见到「已损坏」。
            codesign --force --sign - "$APP_PATH"
            codesign --verify --strict --verbose=2 "$APP_PATH"
          fi

      - name: Sign & notarize app (x86_64)
        if: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.sign) && env.APPLE_SIGNING_IDENTITY != '' }}
        env:
          ENTITLEMENTS_PATH: desktop/src-tauri/Entitlements.plist
        run: |
          APP_PATH=$(find desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/macos -name "*.app" -maxdepth 1 | head -1)
          bash desktop/scripts/macos-sign-notarize.sh app "$APP_PATH"

      # Rebuild updater .tar.gz after embedding Finder Extension
      - name: Rebuild updater artifact with Finder Extension (x86_64)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          BUNDLE_DIR=desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/macos
          APP_NAME=$(basename "$(find "$BUNDLE_DIR" -name "*.app" -maxdepth 1 | head -1)")
          if [ -n "$APP_NAME" ] && [ -f "$BUNDLE_DIR/${APP_NAME}.tar.gz" ]; then
            echo "Rebuilding ${APP_NAME}.tar.gz with Finder Extension..."
            cd "$BUNDLE_DIR"
            rm -f "${APP_NAME}.tar.gz"
            tar czf "${APP_NAME}.tar.gz" "$APP_NAME"
            if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
              npx --yes @tauri-apps/cli signer sign -k "$TAURI_SIGNING_PRIVATE_KEY" \
                ${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:+-p "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"} \
                "${APP_NAME}.tar.gz"
            fi
          fi

      - name: Rename updater artifacts (x86_64)
        run: |
          BUNDLE_DIR=desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/macos
          if [ -f "$BUNDLE_DIR/MeTerm.app.tar.gz" ]; then
            mv "$BUNDLE_DIR/MeTerm.app.tar.gz" "$BUNDLE_DIR/MeTerm_x86_64.app.tar.gz"
            mv "$BUNDLE_DIR/MeTerm.app.tar.gz.sig" "$BUNDLE_DIR/MeTerm_x86_64.app.tar.gz.sig"
          fi

      # Rebuild DMG after embedding Finder Extension
      - name: Rebuild DMG with Finder Extension (x86_64)
        run: |
          DMG_DIR=desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg
          APP_PATH=$(find desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/macos -name "*.app" -maxdepth 1 | head -1)
          if [ -n "$APP_PATH" ] && [ -d "$DMG_DIR" ]; then
            APP_NAME=$(basename "$APP_PATH" .app)
            OLD_DMG=$(find "$DMG_DIR" -name "*.dmg" -maxdepth 1 | head -1)
            if [ -n "$OLD_DMG" ]; then
              DMG_NAME=$(basename "$OLD_DMG")
              rm -f "$OLD_DMG"
              bash desktop/scripts/build-dmg.sh "$APP_PATH" "$DMG_DIR/$DMG_NAME" "$APP_NAME"
            fi
          fi

      - name: Sign & notarize dmg (x86_64)
        if: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.sign) && env.APPLE_SIGNING_IDENTITY != '' }}
        run: |
          DMG_PATH=$(find desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg -name "*.dmg" -maxdepth 1 | head -1)
          if [ -n "$DMG_PATH" ]; then
            bash desktop/scripts/macos-sign-notarize.sh dmg "$DMG_PATH"
          fi

      - name: Upload DMG (x86_64)
        uses: actions/upload-artifact@v4
        with:
          name: meterm-macos-x86_64-dmg
          path: desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          retention-days: 1

      - name: Upload App Bundle (x86_64)
        uses: actions/upload-artifact@v4
        with:
          name: meterm-macos-x86_64-app
          path: desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app
          retention-days: 1

      - name: Compose release body (tag only)
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: bash .github/scripts/release-body.sh "${GITHUB_REF_NAME}" > "${RUNNER_TEMP}/release-body.md"

      - name: Publish release assets (tag only)
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*_x86_64.app.tar.gz
            desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*_x86_64.app.tar.gz.sig
          # 正文由 UPDATE.md 现场生成 / body generated from UPDATE.md
          body_path: ${{ runner.temp }}/release-body.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
