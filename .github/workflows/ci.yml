name: CI

# 在 main 的 push 和 PR 上跑测试与静态检查；只读，不产出安装包、不碰 Release。
# Tests and static checks on pushes to main and on PRs. Read-only: no bundles, no releases.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同一分支 / PR 有新提交时取消旧的运行 / cancel superseded runs on the same ref
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # `npm test` 依赖 `node --experimental-strip-types`，需要 Node >= 22.6
  # `npm test` relies on `node --experimental-strip-types`, which needs Node >= 22.6
  NODE_VERSION: '22'
  # 与 build-macos.yml / tauri.conf.json 的 minimumSystemVersion 保持一致
  MACOSX_DEPLOYMENT_TARGET: '14.0'
  CARGO_TERM_COLOR: always
  # CI 不需要调试符号：编译、链接更快，缓存更小 / no debuginfo in CI: faster builds, smaller cache
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  # PR 只改前端时跳过 Rust job；push 到 main 总是全跑（同时为 PR 预热 Rust 缓存）。
  # Skip the Rust job on PRs that don't touch it; pushes to main always run it (and warm the cache).
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ github.event_name != 'pull_request' || steps.filter.outputs.rust == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'desktop/src-tauri/**'
              - '.github/workflows/ci.yml'

  frontend:
    name: Frontend (test + tsc)
    # 前端检查与平台无关，放 ubuntu：不用排 macOS runner 的队。Ubuntu 的 `sh` 是 dash，
    # shell hook 测试因此还会验证 hook 能被纯 POSIX sh 解析。
    # Platform-neutral, so it runs on ubuntu and never waits for a macOS runner. Ubuntu's
    # `sh` is dash, so the shell-hook tests also check the hooks parse under plain POSIX sh.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # shell hook 测试会对每个可用的 shell 做语法检查和实跑；ubuntu 默认没有 zsh
      # The shell-hook tests check every shell they find; ubuntu has no zsh by default.
      - name: Install zsh
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends zsh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Desktop frontend build (tsc + vite)
        working-directory: desktop
        run: |
          npm ci
          npm run build

      - name: Desktop frontend tests
        working-directory: desktop
        run: npm test

  rust:
    name: Rust (fmt + clippy + test)
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26 (same as build-macos.yml)
        run: |
          XCODE_26=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE_26" ]; then
            sudo xcode-select -s "$XCODE_26"
            echo "Selected: $XCODE_26"
          fi
          xcodebuild -version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      # tauri::generate_context! 需要 desktop/dist/
      # generate_context! needs desktop/dist/
      - name: Build desktop frontend
        run: |
          (cd desktop && npm ci && npm run build)

      - name: cargo fmt --check
        working-directory: desktop/src-tauri
        run: cargo fmt --all -- --check

      # 只拦截 error 级别的 lint；现有的 warning 尚未清理，暂不加 -D warnings。
      # Blocks on error-level lints only; existing warnings aren't cleaned up yet, so no -D warnings.
      - name: cargo clippy
        working-directory: desktop/src-tauri
        run: cargo clippy --all-targets

      - name: cargo test
        working-directory: desktop/src-tauri
        run: cargo test

  # Windows 专属代码（ConPTY、WSL 等）平时只在发版构建时编译；这里在 PR 上做 clippy + test。
  # macOS 专属代码仍由上面的 rust job 覆盖，两者并行。
  # Windows-only code (ConPTY, WSL, ...) otherwise only compiles in release builds; lint and
  # test it on PRs too. macOS-only code stays covered by the rust job above; both run in parallel.
  rust-windows:
    name: Rust Windows (clippy + test)
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      # tauri.windows.conf.json 把 conpty.dll / OpenConsole.exe 列为资源，tauri-build 要求文件存在；
      # 版本与 build-windows.yml 保持一致。
      # tauri.windows.conf.json lists conpty.dll / OpenConsole.exe as resources and tauri-build
      # requires them to exist; versions match build-windows.yml.
      - name: Download ConPTY
        shell: cmd
        run: |
          set "NUGET_URL=https://www.nuget.org/api/v2/package/CI.Microsoft.Windows.Console.ConPTY/1.22.250314001"
          set "WT_VERSION=1.23.20211.0"
          set "WT_URL=https://github.com/microsoft/terminal/releases/download/v%WT_VERSION%/Microsoft.WindowsTerminal_%WT_VERSION%_x64.zip"
          mkdir desktop\src-tauri\binaries\conpty
          mkdir %TEMP%\nuget_pkg
          mkdir %TEMP%\wt_pkg
          curl -fSL -o %TEMP%\nuget_pkg\conpty.nupkg "%NUGET_URL%" || exit /b 1
          tar -xf %TEMP%\nuget_pkg\conpty.nupkg -C %TEMP%\nuget_pkg || exit /b 1
          for /r %TEMP%\nuget_pkg %%F in (conpty.dll) do if "%%~nxF"=="conpty.dll" copy "%%F" desktop\src-tauri\binaries\conpty\conpty.dll
          curl -fSL -o %TEMP%\wt_pkg\wt.zip "%WT_URL%" || exit /b 1
          tar -xf %TEMP%\wt_pkg\wt.zip -C %TEMP%\wt_pkg || exit /b 1
          for /r %TEMP%\wt_pkg %%F in (OpenConsole.exe) do if "%%~nxF"=="OpenConsole.exe" copy "%%F" desktop\src-tauri\binaries\conpty\OpenConsole.exe
          if not exist desktop\src-tauri\binaries\conpty\conpty.dll exit /b 1
          if not exist desktop\src-tauri\binaries\conpty\OpenConsole.exe exit /b 1
          dir desktop\src-tauri\binaries\conpty

      # tauri::generate_context! 需要 desktop/dist/
      # generate_context! needs desktop/dist/
      - name: Build desktop frontend
        shell: bash
        run: |
          (cd desktop && npm ci && npm run build)

      # 先不加 -D warnings：Windows 专属代码的警告从未清理过。
      # No -D warnings yet: Windows-only code has never been cleaned up.
      - name: cargo clippy
        working-directory: desktop/src-tauri
        run: cargo clippy --all-targets

      - name: cargo test
        working-directory: desktop/src-tauri
        run: cargo test
