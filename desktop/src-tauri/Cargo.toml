[package]
name = "meterm"
version = "0.3.3"
edition = "2021"
license = "MIT"

[lib]
name = "meterm_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
# Development-only mobile control plane. Documented dev entrypoints enable it
# explicitly; distributable builds must never carry these bearer-authorized
# desktop capabilities until the independent control Broker release gate is complete.
development-mobile-control = []
# Explicitly permits the signed, isolated MeTerm Dev bundle to perform a
# one-way, owner-confirmed recovery from the production SSH Keychain namespace.
development-credential-recovery = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Web inspector is available automatically in debug builds. Do not enable the
# `devtools` feature here: that would compile it into production builds too.
tauri = { version = "2.11.1", features = ["protocol-asset", "tray-icon", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["formatting"] }
reqwest = { version = "0.12", features = ["json", "cookies", "rustls-tls-native-roots"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat", "io"] }
tokio-socks = "0.5"
base64 = "0.22"
libc = "0.2"
zeroize = "1"

# In-process HTTP server (replaces Go sidecar)
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "timeout"] }
futures-util = "0.3"
# 把 axum Router 手动跑在 hyper 连接上(注入连接来源元数据)
hyper-util = { version = "0.1", features = ["server-auto", "service", "tokio"] }
sha2 = "0.10"
p256 = { version = "0.13", features = ["ecdsa"] }
bytes = "1"

# Cross-platform PTY
xpty = "0.3"

# SSH. Keep the ring backend used by the existing builds, retain compression
# and RSA key support, and avoid the aws-lc default backend.
russh = { version = "0.61.1", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = { path = "crates/russh-sftp" }


# Character encoding conversion
encoding_rs = "0.8"

# System information
sysinfo = "0.33"

# Random token generation
rand = "0.8"

# Async trait support
async-trait = "0.1"

# URL encoding
urlencoding = "2"

# File time manipulation (for touch command)
filetime = "0.2"
tauri-plugin-clipboard-manager = "2"
arboard = { version = "3", default-features = false }
miniz_oxide = "0.8"
tauri-plugin-notification = "2"
notify-rust = "4"
tauri-plugin-single-instance = "2"
hostname = "0.4.2"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
dirs = "6"
zip = { version = "2", default-features = false, features = ["deflate"] }

# Filesystem search (powering ai-tools-search.ts)
walkdir = "2"
globset = "0.4"
regex = "1"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
objc2 = "0.5"
objc2-app-kit = { version = "0.2", features = [
    "NSWindow", "NSResponder", "NSGraphics", "NSColor",
    "NSButton", "NSControl", "NSView",
] }
objc2-foundation = { version = "0.2", features = ["NSNotification", "NSString", "NSThread", "NSOperation", "block2"] }
objc2-local-authentication = { version = "0.2", features = ["LAContext", "block2"] }
block2 = "0.5"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.55"
windows = { version = "0.62", features = [
    "Foundation",
    "Security_Credentials_UI",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_WinRT",
] }
windows-future = "0.3"

[profile.release]
strip = true
lto = true
codegen-units = 1
